<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>可視化版 LiteTube (修正版)</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; background: #fafafa; color: #333; }
        #url { width: 70%; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        .btn { padding: 12px 24px; font-size: 16px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; margin: 5px; }
        .btn-start { background: #007bff; color: white; }
        .btn-bypass { background: #dc3545; color: white; }
        #status-box { background: #e9ecef; padding: 15px; border-radius: 5px; max-width: 800px; margin: 20px auto; text-align: left; font-family: monospace; font-size: 14px; }
        #player { margin-top: 20px; max-width: 800px; margin-left: auto; margin-right: auto; }
        .success { color: green; font-weight: bold; }
        .warning { color: #d39e00; font-weight: bold; }
    </style>
</head>
<body>

    <h2>規制回避型 LiteTube (修正版)</h2>
    
    <input id="url" placeholder="YouTubeのURLをペースト">
    <div>
        <button class="btn btn-start" onclick="loadVideo('nocookie')">ルート1で流す</button>
        <button class="btn btn-bypass" onclick="loadVideo('direct')">フィルターが厳しければルート2</button>
    </div>

    <!-- 状況が見えるログエリア -->
    <div id="status-box">
        <div><strong>【現在の接続ステータス】</strong></div>
        <div id="status-text">URLを入力してボタンを押してください。</div>
    </div>

    <div id="player"></div>

    <script>
    function loadVideo(type) {
        const url = document.getElementById("url").value.trim();
        
        // YouTubeの各種URLから動画ID（11文字の英数字）を抜き出す正規表現
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        
        // 正しくIDが取れて、かつそれが11文字であることを厳密にチェック（バグを修正）
        const videoId = (match && match[2].length === 11) ? match[2] : null;

        if (!videoId) {
            alert("正しいYouTubeのURLを入力してください。");
            return;
        }

        let embedUrl = "";
        let routeName = "";

        if (type === 'nocookie') {
            routeName = "公式裏ルート (youtube-nocookie)";
            // 各種制限を突破するための公式パラメータを付与
            embedUrl = `https://youtube-nocookie.com{videoId}?autoplay=1&modestbranding=1&rel=0&embeds_referring_euri=https%3A%2F%2Fgithub.com%2F`;
        } else {
            routeName = "通常埋め込みルート (youtube.com)";
            embedUrl = `https://youtube.com{videoId}?autoplay=1`;
        }

        // 状況をログ出力
        document.getElementById("status-text").innerHTML = 
            `▶ <span class="success">変更適用：</span> 現在、[<span class="warning">${routeName}</span>] を使用中。<br>` +
            `動画ID [<b>${videoId}</b>] を正常に認識しました！<br>` +
            `生成URL ➔ <small>${embedUrl}</small>`;

        // プレイヤーを出力
        document.getElementById("player").innerHTML =
            `<iframe
                width="100%"
                height="450"
                src="${embedUrl}"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>`;
    }
    </script>

</body>
</html>
