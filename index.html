<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>完全突破版 LiteTube (バグ修正済)</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; background: #111; color: #eee; }
        #url { width: 70%; padding: 12px; font-size: 16px; border: 1px solid #444; background: #222; color: #fff; border-radius: 4px; }
        .btn { padding: 12px 24px; font-size: 16px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; margin: 5px; background: #28a745; color: white; }
        .btn:hover { background: #218838; }
        #status-box { background: #222; border: 1px solid #444; padding: 15px; border-radius: 5px; max-width: 800px; margin: 20px auto; text-align: left; font-family: monospace; font-size: 14px; }
        #player { margin-top: 20px; max-width: 800px; margin-left: auto; margin-right: auto; }
        .info { color: #00ffcc; font-weight: bold; }
    </style>
</head>
<body>

    <h2>完全規制突破版 LiteTube (バグ修正済)</h2>
    <p style="font-size: 13px; color: #aaa;">YouTubeが完全遮断されたChromebookでも、動画データを直引きして再生します。</p>
    
    <input id="url" placeholder="YouTubeの動画URLをペースト">
    <div>
        <button class="btn" onclick="bypassAndLoad()">動画を強制的に流す</button>
    </div>

    <!-- ステータス可視化ログ -->
    <div id="status-box">
        <div><strong>【現在の接続ステータス】</strong></div>
        <div id="status-text">URLを入力して「動画を強制的に流す」を押してください。</div>
    </div>

    <div id="player"></div>

    <script>
    function bypassAndLoad() {
        const url = document.getElementById("url").value.trim();
        
        // YouTubeの各種URLから動画IDを取り出す正規表現
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        
        // 【修正完了】match[2] に入っている動画IDそのものの文字数が「11文字」であるかを正しくチェック
        const videoId = (match && match[2] && match[2].length === 11) ? match[2] : null;

        if (!videoId) {
            alert("URLから動画のID（11文字）が読み取れませんでした。もう一度URLを確認してください。");
            return;
        }

        // ログエリアに情報を可視化
        document.getElementById("status-text").innerHTML = 
            `▶ <span class="info">[解析成功]</span> 動画ID: <b>${videoId}</b> を検出しました！<br>` +
            `YouTubeのサーバーをバイパスし、外部の動画ストリームへ直接接続を試みています...`;

        // 外部のオープンソースAPIを利用して、YouTubeの動画を「生MP4ファイル」として裏から引っ張るURL
        const proxyStreamUrl = `https://wuk.sh{videoId}&quality=720`;

        // iframe（埋め込み）ではなく、ただの動画ファイルを再生するプレイヤー（<video>）として出力
        document.getElementById("player").innerHTML =
            `<video 
                width="100%" 
                height="450" 
                src="${proxyStreamUrl}" 
                controls 
                autoplay
                style="background: #000; border-radius: 8px;">
                お使いのChromebookでは直接再生がサポートされていません。
            </video>`;
    }
    </script>

</body>
</html>
