<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>パケット偽装版 LiteTube (修正完了)</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; background: #111; color: #eee; }
        #url { width: 70%; padding: 12px; font-size: 16px; border: 1px solid #444; background: #222; color: #fff; border-radius: 4px; }
        .btn { padding: 12px 24px; font-size: 16px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; margin: 5px; background: #007bff; color: white; }
        #status-box { background: #222; border: 1px solid #444; padding: 15px; border-radius: 5px; max-width: 800px; margin: 20px auto; text-align: left; font-family: monospace; font-size: 14px; }
        #player { margin-top: 20px; max-width: 800px; margin-left: auto; margin-right: auto; }
        .info { color: #ffc107; }
    </style>
</head>
<body>

    <h2>パケットリセット機能付き LiteTube (修正完了)</h2>
    <p style="font-size: 13px; color: #aaa;">Googleプロキシを中継し、2分の壁を突破するための実験コードです。</p>
    
    <input id="url" placeholder="YouTubeの動画URLをペースト">
    <div>
        <button class="btn" onclick="loadDisguisedVideo()">動画を流す</button>
    </div>

    <div id="status-box">
        <div><strong>【パケット監視 回避ステータス】</strong></div>
        <div id="status-text">URLを入力してボタンを押してください。</div>
    </div>

    <div id="player"></div>

    <script>
    let intervalId = null;

    function loadDisguisedVideo() {
        const url = document.getElementById("url").value.trim();
        
        // URLから11文字の動画IDだけを確実に抜き出す正規表現
        const regExp = /(?:v=|youtu\.be\/|embed\/)([a-zA-Z0-9_-]{11})/;
        const match = url.match(regExp);

        if (!match) {
            alert("URLから動画のIDが見つかりませんでした。");
            return;
        }

        // 【修正点】match[1] とすることで、確実に11文字のID（例: 99HBc1Y7J2w）を取り出します
        const videoId = match[1]; 

        // フィルターをすり抜けるため、Google公式プロキシ(opensocial)を経由してInvidiousの動画ストリームに接続
        const targetStream = `https://googleusercontent.com{encodeURIComponent('https://yewtu.be' + videoId + '&itag=18')}`;

        document.getElementById("status-text").innerHTML = 
            `▶ <span class="info">[動画認識成功]</span> ID: <b>${videoId}</b><br>` +
            `▶ Googleプロキシを中継してストリーミング接続中...`;

        // プレイヤーを出力
        document.getElementById("player").innerHTML =
            `<video 
                id="stealth-video"
                width="100%" 
                height="450" 
                src="${targetStream}" 
                controls 
                autoplay
                style="background: #000; border-radius: 8px;">
            </video>`;

        // Startpageの「2〜5分で止まる」を回避するため、1分50秒ごとにセッションを一瞬リセットする処理
        if (intervalId) clearInterval(intervalId);
        
        intervalId = setInterval(() => {
            const video = document.getElementById("stealth-video");
            if (video) {
                const currentTime = video.currentTime;
                document.getElementById("status-text").innerHTML += `<br>🔄 フィルターを欺くため、通信パケットを一瞬リセットしました。`;
                
                // タイムスタンプ(&t=...)を付与して新しい通信に見せかける
                video.src = targetStream + "&t=" + new Date().getTime(); 
                video.load();
                
                // 元の再生位置から自動再開
                video.onloadedmetadata = () => {
                    video.currentTime = currentTime;
                    video.play();
                };
            }
        }, 110000); // 1分50秒ごと
    }
    </script>

</body>
</html>
