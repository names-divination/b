<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>LiteTubeプレイヤー</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; background: #fafafa; }
        #url { width: 70%; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 12px 24px; font-size: 16px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #bd2130; }
        #player { margin-top: 20px; max-width: 800px; margin-left: auto; margin-right: auto; }
    </style>
</head>
<body>

    <h2>YouTubeのURLを貼り付けてください（予備サーバー版）</h2>
    
    <input id="url" placeholder="URLをここにペースト">
    <button onclick="loadVideo()">動画を流す</button>

    <div id="player"></div>

    <script>
    function loadVideo() {
        const url = document.getElementById("url").value.trim();
        
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        const videoId = (match && match.length == 11) ? match[2] : null;

        if (videoId) {
            // yewtu.be がダメな場合、現在比較的安定している「piped」という別システムの中継プレイヤーを使います
            // もしここもChromebookで弾かれる場合は、別のドメインに差し替えます
            document.getElementById("player").innerHTML =
                `<iframe
                    width="100%"
                    height="450"
                    src="https://piped.video{videoId}?autoplay=1"
                    frameborder="0"
                    allow="autoplay; encrypted-media; picture-in-picture"
                    allowfullscreen>
                </iframe>`;
        } else {
            alert("正しいURLを入力してください。");
        }
    }
    </script>

</body>
</html>
