<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>LiteTube (ダイレクトファイルプレイヤー)</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; background: #111; color: #eee; }
        #url { width: 70%; padding: 12px; font-size: 16px; border: 1px solid #444; background: #222; color: #fff; border-radius: 4px; }
        .btn { padding: 12px 24px; font-size: 16px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; background: #28a745; color: white; }
        #status-box { background: #222; border: 1px solid #444; padding: 15px; border-radius: 5px; max-width: 800px; margin: 20px auto; text-align: left; font-family: monospace; font-size: 13px; color: #00ffcc; }
        #player { margin-top: 20px; max-width: 800px; margin-left: auto; margin-right: auto; }
    </style>
</head>
<body>

    <h2>LiteTube (ダイレクト再生プレイヤー)</h2>
    <p style="font-size: 13px; color: #aaa;">変換サイト等で取得した「動画ファイル（MP4形式など）の直リンク」をそのまま貼り付けてください。</p>
    
    <input id="url" placeholder="httpから始まる、動画ファイルの直リンクURLをペースト">
    <button class="btn" onclick="loadDirectVideo()">動画を流す</button>

    <div id="status-box">
        <div><strong>【プレイヤー状態】</strong></div>
        <div id="log-text">動画ファイルのURLが入力されるのを待っています...</div>
    </div>

    <div id="player"></div>

    <script>
    function loadDirectVideo() {
        const log = document.getElementById("log-text");
        const videoUrl = document.getElementById("url").value.trim();

        if (!videoUrl || !videoUrl.startsWith("http")) {
            alert("正しい動画URL（httpから始まるリンク）を入力してください。");
            return;
        }

        log.innerHTML = `⏳ 動画の読み込みセッションを開始しました...<br>🔗 対象URL: <small>${videoUrl}</small>`;

        // 外部への自動Fetch通信は一切おこなわず、ブラウザ標準のプレイヤー（<video>）にそのままURLを渡す
        document.getElementById("player").innerHTML =
            `<video 
                width="100%" 
                height="450" 
                src="${videoUrl}" 
                controls 
                autoplay
                onerror="handleError()"
                style="background: #000; border-radius: 8px;">
                お使いのブラウザは直接再生に対応していません。
            </video>`;
    }

    function handleError() {
        document.getElementById("log-text").innerHTML = 
            `❌ <span style='color:#ff4757; font-weight:bold;'>再生失敗：</span> 動画データの読み込みに失敗しました。<br>` +
            `貼られたリンクの有効期限が切れているか、Chromebookのフィルターがこの動画データ元のサーバーへの接続をブロックしました。`;
    }
    </script>

</body>
</html>
